name: Build and Release Spendly Android APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure Environment Configuration
        run: |
          mkdir -p lib/core/constants
          if [ ! -f lib/core/constants/config.dart ]; then
            echo "Creating AppConfig for CI build..."
            echo "class AppConfig {" > lib/core/constants/config.dart
            echo "  static const bool forceSandboxMode = false;" >> lib/core/constants/config.dart
            echo "  static const String supabaseUrl = String.fromEnvironment('SUPABASE_URL', defaultValue: '${{ secrets.SUPABASE_URL }}');" >> lib/core/constants/config.dart
            echo "  static const String supabaseAnonKey = String.fromEnvironment('SUPABASE_ANON_KEY', defaultValue: '${{ secrets.SUPABASE_ANON_KEY }}');" >> lib/core/constants/config.dart
            echo "  static bool isSupabaseInitialized = false;" >> lib/core/constants/config.dart
            echo "  static bool get isSupabaseConfigured => supabaseUrl.isNotEmpty && supabaseAnonKey.isNotEmpty;" >> lib/core/constants/config.dart
            echo "}" >> lib/core/constants/config.dart
          fi

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Build Production APKs (Split per ABI & Universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Prepare Named APK Assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Spendly-${{ env.VERSION }}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Spendly-${{ env.VERSION }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/Spendly-${{ env.VERSION }}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/Spendly-${{ env.VERSION }}-x86_64.apk
          ls -lh release-assets/

      - name: Create GitHub Release and Upload APK Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Spendly ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/Spendly-${{ env.VERSION }}.apk
            release-assets/Spendly-${{ env.VERSION }}-arm64-v8a.apk
            release-assets/Spendly-${{ env.VERSION }}-armeabi-v7a.apk
            release-assets/Spendly-${{ env.VERSION }}-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
